# postgresql.conf del laboratorio SOFIPO.

# El contenedor no debe intentar tomar toda la memoria del host. Cada línea lleva
# comentario de qué hace y por qué está aquí.

# Memoria

# Memoria compartida para páginas de datos e índices. Es lo primero que mira el
# planeador para cachear. 512MB es está bien para este dataset (< 2 GB) sin acaparar RAM.
shared_buffers = 512MB

# Memoria por operación de orden/hash ANTES de usar el disco. Cada nodo de una
# query puede usar hasta este valor, así que se multiplica por concurrencia: 16MB
# está bien con max_connections=50. Subirlo acelera los sorts grandes de los ejercicios.
work_mem = 16MB

# Memoria para mantenimiento (CREATE INDEX, VACUUM, ALTER TABLE). El seed crea los
# índices al final sobre millones de filas, entonces le doy 256MB para hacer esto más rápido.
maintenance_work_mem = 256MB

# Estimación de cuánta caché de SO+Postgres hay disponible para datos. NO reserva
# memoria, solo ile nforma al planeador para preferir Index Scan sobre Seq Scan. 2GB
# es una estimación únicamente.
effective_cache_size = 2GB

# Costo relativo de leer una página aleatoria vs secuencial. El default es 4.0 y asume
# que se está usando un HDD. En un NVME (que es mi caso) la penalización del acceso aleatorio es mínima, así
# que 1.1 hace que el planeador use índices cuando de verdad conviene.
random_page_cost = 1.1          # para SSD/NVMe

# Tope de conexiones simultáneas. Un laboratorio de una sola persona no necesita más,
# y limitarlo protege el presupuesto de memoria (recordando que work_mem es por operación).
max_connections = 50

# Localización

# Zona horaria de la sesión por defecto. Todo el dominio vive en hora de México,
# los ejercicios de zona horaria (E27) dependen de que esto sea explícito.
timezone = 'America/Mexico_City'

# Idioma de los mensajes del servidor. 'C' = inglés neutro,
# para que los errores sean fáciles de googlear.
lc_messages = 'C'

# Observabilidad: pg_stat_statements y auto_explain

# Carga las librerías al arrancar el servidor (requieren preload, no basta CREATE
# EXTENSION). pg_stat_statements agrega estadísticas por consulta y auto_explain
# vuelca planes de las consultas lentas al log.
shared_preload_libraries = 'pg_stat_statements,auto_explain'

# Máximo de sentencias distintas que pg_stat_statements recuerda. 5000 sobra para
# el catálogo de ejercicios y deja espacio para experimentar.
pg_stat_statements.max = 5000

# 'all' rastrea también las sentencias anidadas (dentro de funciones como
# lab.verificar), no solo las de nivel superior. Necesario para `just slow`.
pg_stat_statements.track = all

# auto_explain: planes automáticos de lo lento

# Registra el plan de cualquier sentencia que tarde >= 500ms. Umbral bajo a propósito:
# en el módulo 8 hay que ver planes sin tener que pedir EXPLAIN a mano.
auto_explain.log_min_duration = '500ms'

# Incluye tiempos reales por nodo (equivale a EXPLAIN ANALYZE). Tiene algo de overhead
# pero está bien para un lab; es lo que enseña el módulo 8.
auto_explain.log_analyze = on

# Añade contadores de BUFFERS (páginas leídas de caché vs disco) al plan registrado.
auto_explain.log_buffers = on

# Registra también las sentencias anidadas dentro de funciones. Sin esto, el SQL que
# corre lab.verificar no aparecería en los planes.
auto_explain.log_nested_statements = on

# Logging general

# Registra en el log toda sentencia de nivel superior que tarde >= 1s. Complementa
# a auto_explain (que da el plan) con un registro simple del texto y la duración.
log_min_duration_statement = '1s'

# Registra cada checkpoint. Útil para entender pausas de I/O durante el bulk load.
log_checkpoints = on

# Registra toda actividad de autovacuum (umbral 0 = todo). Ayuda a ver el efecto de
# ANALYZE y del mantenimiento sobre las estadísticas que usa el módulo 8.
log_autovacuum_min_duration = 0

# I/O timing

# Mide el tiempo real de lectura/escritura de bloques. Es lo que habilita que
# EXPLAIN (ANALYZE, BUFFERS) muestre tiempos de I/O reales, el módulo 8 lo usa.
track_io_timing = on
